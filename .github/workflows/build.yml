name: build
on:
  push:
    branches: [export]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: gtvpn-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: gtvpn-linux-arm64
          - os: macos-15-intel
            artifact: gtvpn-macos-x86_64
          - os: macos-15
            artifact: gtvpn-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bazel test //Utilities/GtVpn:cli_test --test_output=errors
      - run: bazel build //Utilities/GtVpn:gtvpn
      - run: |
          version=$(sed -n 's/^ *version = "\(.*\)",$/\1/p' MODULE.bazel | head -n 1)
          reported=$(GTVPN_CACHE="$RUNNER_TEMP/cache" ./bazel-bin/Utilities/GtVpn/gtvpn version)
          echo "$reported"
          [[ "$reported" == "gtvpn $version ("* ]]
      - run: tar -czf "$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz" -C bazel-bin/Utilities/GtVpn gtvpn
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz
  release:
    needs: build
    if: github.ref == 'refs/heads/export'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - run: |
          version=$(sed -n 's/^ *version = "\(.*\)",$/\1/p' MODULE.bazel | head -n 1)
          if ! gh release view "v$version" > /dev/null 2>&1; then
            gh release create "v$version" --target "$GITHUB_SHA" --title "gtvpn $version" --notes "" "$RUNNER_TEMP"/artifacts/*.tar.gz
          fi
      - run: git push origin HEAD:main
